<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 sidebar p-3">
                <h4 class="mb-4">Finance RAG</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard.html">Dashboard</a>
                    <a class="nav-link" href="/upload.html">Upload Documents</a>
                    <a class="nav-link active" href="/documents.html">Document Library</a>
                    <a class="nav-link" href="/ratios.html">Ratio Analysis</a>
                    <a class="nav-link" href="/financial_dashboard.html">Financial Dashboard</a>
                    <a class="nav-link" href="/insights.html">AI Insights</a>
                    <a class="nav-link" href="/chat.html">RAG Chat</a>
                    <a class="nav-link" href="/reports.html">Reports</a>
                    <a class="nav-link" href="/comparison.html">Comparable Analysis</a>
                    <a class="nav-link" href="/valuation.html">Valuation</a>
                </nav>
            </aside>
            <main class="col-md-10 main-panel">
                <h2>Document Library</h2>
                <div class="card p-4 mt-4">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4"><input class="form-control" id="searchInput"
                                placeholder="Search documents"></div>
                        <div class="col-md-3"><select class="form-select" id="companyFilter">
                                <option value="">Company</option>
                            </select></div>
                        <div class="col-md-3"><select class="form-select" id="yearFilter">
                                <option value="">Year</option>
                            </select></div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>File</th>
                                    <th>Type</th>
                                    <th>Year</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="documentsTable"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>

</html>
