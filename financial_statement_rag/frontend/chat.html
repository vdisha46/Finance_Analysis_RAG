<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 sidebar p-3">
                <h4 class="mb-4">Finance RAG</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard.html">Dashboard</a>
                    <a class="nav-link" href="/upload.html">Upload Documents</a>
                    <a class="nav-link" href="/documents.html">Document Library</a>
                    <a class="nav-link" href="/ratios.html">Ratio Analysis</a>
                    <a class="nav-link" href="/financial_dashboard.html">Financial Dashboard</a>
                    <a class="nav-link" href="/insights.html">AI Insights</a>
                    <a class="nav-link active" href="/chat.html">RAG Chat</a>
                    <a class="nav-link" href="/reports.html">Reports</a>
                    <a class="nav-link" href="/comparison.html">Comparable Analysis</a>
                    <a class="nav-link" href="/valuation.html">Valuation</a>
                </nav>
            </aside>
            <main class="col-md-10 main-panel">
                <h2>RAG Financial Analyst</h2>
                <div class="card p-4 mt-4">
                    <div class="chat-window mb-3" id="chatWindow"></div>
                    <div class="mb-3">
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-sm btn-outline-primary question-btn">What is the company's current
                                ratio?</button>
                            <button class="btn btn-sm btn-outline-primary question-btn">Analyze the company's
                                profitability.</button>
                            <button class="btn btn-sm btn-outline-primary question-btn">Explain revenue growth
                                trends.</button>
                            <button class="btn btn-sm btn-outline-primary question-btn">Summarize the annual
                                report.</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <input type="text" class="form-control" id="chatInput"
                            placeholder="Ask about the financial statements...">
                        <button class="btn btn-primary" id="sendChatBtn">Send</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/chat.js"></script>
</body>

</html>
