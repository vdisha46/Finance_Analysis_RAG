<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparable Company Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 sidebar p-3">
                <h4 class="mb-4">Finance RAG</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard.html">Dashboard</a>
                    <a class="nav-link" href="/upload.html">Upload Documents</a>
                    <a class="nav-link" href="/documents.html">Document Library</a>
                    <a class="nav-link" href="/ratios.html">Ratio Analysis</a>
                    <a class="nav-link" href="/financial_dashboard.html">Financial Dashboard</a>
                    <a class="nav-link" href="/insights.html">AI Insights</a>
                    <a class="nav-link" href="/chat.html">RAG Chat</a>
                    <a class="nav-link" href="/reports.html">Reports</a>
                    <a class="nav-link active" href="/comparison.html">Comparable Analysis</a>
                    <a class="nav-link" href="/valuation.html">Valuation</a>
                </nav>
            </aside>
            <main class="col-md-10 main-panel">
                <h2>Comparable Company Analysis</h2>
                <div class="card p-4 mt-4">
                    <div class="row g-3 mb-4">
                        <div class="col-md-5"><input class="form-control" id="companyA" placeholder="Company A"></div>
                        <div class="col-md-5"><input class="form-control" id="companyB" placeholder="Company B"></div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" id="compareBtn">Compare</button>
                        </div>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6"><canvas id="revenueComparison"></canvas></div>
                        <div class="col-md-6"><canvas id="profitComparison"></canvas></div>
                        <div class="col-md-6"><canvas id="roeComparison"></canvas></div>
                        <div class="col-md-6"><canvas id="roaComparison"></canvas></div>
                        <div class="col-md-6"><canvas id="debtComparison"></canvas></div>
                        <div class="col-md-6"><canvas id="cashFlowComparison"></canvas></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/chart.js"></script>
    <script src="/static/js/comparison.js"></script>
</body>

</html>
