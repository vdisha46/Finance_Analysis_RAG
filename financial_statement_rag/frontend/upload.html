<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 sidebar p-3">
                <h4 class="mb-4">Finance RAG</h4>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard.html">Dashboard</a>
                    <a class="nav-link active" href="/upload.html">Upload Documents</a>
                    <a class="nav-link" href="/documents.html">Document Library</a>
                    <a class="nav-link" href="/ratios.html">Ratio Analysis</a>
                    <a class="nav-link" href="/financial_dashboard.html">Financial Dashboard</a>
                    <a class="nav-link" href="/insights.html">AI Insights</a>
                    <a class="nav-link" href="/chat.html">RAG Chat</a>
                    <a class="nav-link" href="/reports.html">Reports</a>
                    <a class="nav-link" href="/comparison.html">Comparable Analysis</a>
                    <a class="nav-link" href="/valuation.html">Valuation</a>
                </nav>
            </aside>
            <main class="col-md-10 main-panel">
                <h2>Upload Financial Documents</h2>
                <div class="card p-4 mt-4">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" name="company_name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Industry</label>
                                <input type="text" class="form-control" name="industry">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Sector</label>
                                <input type="text" class="form-control" name="sector">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Financial Year</label>
                                <input type="text" class="form-control" name="financial_year">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Report Type</label>
                                <select class="form-select" name="report_type">
                                    <option value="annual_report">Annual Report</option>
                                    <option value="balance_sheet">Balance Sheet</option>
                                    <option value="income_statement">Income Statement</option>
                                    <option value="cash_flow">Cash Flow Statement</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <div class="upload-dropzone">
                                    <input type="file" name="file" class="form-control" accept=".pdf,.csv,.xlsx,.txt"
                                        required>
                                </div>
                            </div>
                        </div>
                        <div class="progress mt-3" style="height: 20px;">
                            <div id="uploadProgress" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Upload</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/upload.js"></script>
</body>

</html>
